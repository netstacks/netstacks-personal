# Published from the NetStacks development repository. This repository is a
# read-only mirror, so pull requests are closed with a pointer to CONTRIBUTING.md.
name: Close pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" --repo "$REPO" --comment "Thanks for the contribution! This repository is a read-only mirror of NetStacks' development repository, so pull requests can't be merged here. Please open an issue describing the change (a link to this branch is welcome) and it will be applied upstream. See CONTRIBUTING.md."
